[project]
name = "gazpar2mqtt"
version = "0.2.6a1"
description = "Gateway that read GrDF meter data and publish them on MQTT queue"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Stéphane Senart" }
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pygazpar>=1.4.0a3",
    "paho-mqtt>=2.1.0",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.5"
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.4.0"
mypy = "^2.4.0"
ruff = "^0.16.10"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
exclude = [ ".venv" ]

[tool.ruff]
# Markdown is excluded, so ruff does not reformat the code samples in the documentation.
exclude = [ ".venv", "*.md" ]
line-length = 120

[tool.ruff.lint]
# E501 is ignored: ruff format owns the line length, and long strings are left as they are.
select = ["E", "F", "W", "I", "B", "UP", "ARG", "RET", "BLE"]
ignore = ["E501"]